name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit: tags can be moved by whoever controls the action.
jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build:local
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-local
          path: web/dist-local
          retention-days: 3

  # JDK 21 is the minimum; JDK 25 proves that the same sources and tests hold on the next LTS.
  java:
    needs: interface
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: [21, 25]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
        working-directory: web
      - run: npm run build:local
        working-directory: web
      - name: Build, test and enforce the Java 21 baseline
        run: ./mvnw -B clean verify -Prequire-web
        shell: bash
      - name: Browser test
        if: runner.os != 'macOS'
        run: npm run e2e
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.os }}-${{ matrix.java }}
          path: '**/target/surefire-reports'
          retention-days: 7

  # What is shipped is compiled once, with JDK 21, and must run unchanged on JDK 25.
  forward-compatibility:
    needs: java
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci && npm run build:local
        working-directory: web
      - run: ./mvnw -B package -DskipTests -Prequire-web
      - name: Run the JDK 21 build on JDK 25
        run: JAVA_HOME="$JAVA_HOME_25_X64" npm run e2e
        working-directory: web
